<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Compassionate disability support illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="900" rx="56" fill="url(#bg)"/>

  <!-- Decorative blobs -->
  <path d="M1040 120c84 58 120 150 88 234-37 97-159 107-222 176-74 81-40 186-160 222-123 37-291-43-347-170-55-126 35-262 119-356 96-108 383-179 522-106z" fill="#dbeafe" opacity="0.7"/>
  <path d="M330 190c70-52 175-55 236 6 63 62 23 160-30 230-50 67-97 155-195 158-107 3-201-87-204-196-3-96 97-154 193-198z" fill="#d1fae5" opacity="0.6"/>

  <!-- Card -->
  <g filter="url(#softShadow)">
    <rect x="140" y="160" width="920" height="580" rx="40" fill="#ffffff"/>
    <rect x="140" y="160" width="920" height="580" rx="40" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <!-- People (abstract, inclusive) -->
  <!-- Person A -->
  <g transform="translate(280 300)">
    <circle cx="120" cy="90" r="44" fill="#fde68a"/>
    <path d="M70 165c20-28 48-42 84-42s64 14 84 42c14 20 18 53 18 83H52c0-30 4-63 18-83z" fill="#bfdbfe"/>
    <path d="M70 170c20 28 50 44 94 44s74-16 94-44" fill="none" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- Person B (support worker) -->
  <g transform="translate(590 270)">
    <circle cx="170" cy="110" r="48" fill="#fed7aa"/>
    <path d="M110 205c26-34 63-50 110-50s84 16 110 50c18 24 24 62 24 98H86c0-36 6-74 24-98z" fill="#bbf7d0"/>
    <path d="M136 236c22 20 52 32 94 32s72-12 94-32" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Connection / support arc -->
  <path d="M468 538c34-60 101-102 177-102 78 0 147 44 180 108" fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
  <circle cx="468" cy="538" r="10" fill="#1d4ed8"/>
  <circle cx="825" cy="544" r="10" fill="#10b981"/>

  <!-- Accessibility symbols (subtle) -->
  <g opacity="0.75">
    <rect x="865" y="220" width="150" height="60" rx="18" fill="#eff6ff" stroke="#dbeafe"/>
    <path d="M920 250h44" stroke="#1d4ed8" stroke-width="10" stroke-linecap="round"/>
    <circle cx="900" cy="250" r="10" fill="#1d4ed8"/>

    <rect x="865" y="300" width="190" height="60" rx="18" fill="#ecfdf5" stroke="#d1fae5"/>
    <path d="M905 330c10 0 18-8 18-18 0-10-8-18-18-18-10 0-18 8-18 18 0 10 8 18 18 18z" fill="#10b981"/>
    <path d="M932 356c14-18 34-28 58-28s44 10 58 28" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>

