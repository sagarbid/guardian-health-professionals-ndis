<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Uplifting disability support illustration">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="56" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1320" cy="190" r="76" fill="#fde68a" opacity="0.95"/>
  <g stroke="#f59e0b" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <path d="M1320 70v44"/>
    <path d="M1320 310v44"/>
    <path d="M1200 190h44"/>
    <path d="M1396 190h44"/>
    <path d="M1240 110l32 32"/>
    <path d="M1368 238l32 32"/>
    <path d="M1400 110l-32 32"/>
    <path d="M1272 238l-32 32"/>
  </g>

  <!-- Hills -->
  <path d="M0 640c240-160 520-220 840-180 220 28 420 98 760-22v462H0V640z" fill="#bbf7d0" opacity="0.55"/>
  <path d="M0 690c260-130 540-170 840-120 250 40 470 20 760-60v390H0V690z" fill="#93c5fd" opacity="0.25"/>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="140" y="180" width="1320" height="520" rx="44" fill="#ffffff"/>
    <rect x="140" y="180" width="1320" height="520" rx="44" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <!-- Accessible path -->
  <path d="M240 600c280-120 540-160 780-120 140 22 270 64 420 38" fill="none" stroke="#e2e8f0" stroke-width="18" stroke-linecap="round"/>
  <path d="M240 600c280-120 540-160 780-120 140 22 270 64 420 38" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- Person using wheelchair (left) -->
  <g transform="translate(320 300)">
    <circle cx="140" cy="90" r="46" fill="#fed7aa"/>
    <path d="M96 165c18-26 42-40 72-40 30 0 54 14 72 40 12 18 16 44 16 70H80c0-26 4-52 16-70z" fill="#dbeafe"/>
    <!-- wheelchair -->
    <circle cx="110" cy="300" r="58" fill="none" stroke="#1d4ed8" stroke-width="12"/>
    <circle cx="110" cy="300" r="10" fill="#1d4ed8"/>
    <path d="M170 230v72c0 22 18 40 40 40h46" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round"/>
    <path d="M150 235h70" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round"/>
    <path d="M210 342l34 44" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round"/>
    <path d="M120 210l24 44" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Support worker (right) -->
  <g transform="translate(900 280)">
    <circle cx="210" cy="110" r="50" fill="#fde68a"/>
    <path d="M148 210c26-34 62-50 110-50s84 16 110 50c18 24 24 62 24 98H124c0-36 6-74 24-98z" fill="#bbf7d0"/>
    <!-- welcoming arm -->
    <path d="M176 252c18 14 40 22 66 22s48-8 66-22" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round"/>
    <path d="M156 238c-30 18-66 30-104 36" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Hearts / sparkle -->
  <g fill="#10b981" opacity="0.9">
    <path d="M770 310c0-18 22-28 36-12 14-16 36-6 36 12 0 26-36 46-36 46s-36-20-36-46z"/>
  </g>
  <g stroke="#1d4ed8" stroke-width="10" stroke-linecap="round" opacity="0.65">
    <path d="M820 380l18-26 18 26-18 26-18-26z"/>
  </g>

  <!-- Caption pills -->
  <g>
    <rect x="240" y="220" width="420" height="56" rx="22" fill="#eff6ff" stroke="#dbeafe"/>
    <text x="270" y="256" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">
      Participant-led • Safe • Respectful
    </text>

    <rect x="700" y="220" width="520" height="56" rx="22" fill="#ecfdf5" stroke="#d1fae5"/>
    <text x="730" y="256" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">
      Independence, dignity and community connection
    </text>
  </g>
</svg>

