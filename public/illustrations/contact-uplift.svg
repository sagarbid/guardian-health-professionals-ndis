<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Uplifting contact illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="56" fill="url(#bg)"/>

  <!-- Phone card -->
  <g filter="url(#shadow)">
    <rect x="260" y="170" width="1080" height="560" rx="48" fill="#ffffff"/>
    <rect x="260" y="170" width="1080" height="560" rx="48" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <!-- Map pin -->
  <path d="M800 280c-84 0-152 68-152 152 0 128 152 288 152 288s152-160 152-288c0-84-68-152-152-152z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="10"/>
  <circle cx="800" cy="432" r="56" fill="#10b981" opacity="0.9"/>
  <circle cx="800" cy="432" r="18" fill="#ffffff"/>

  <!-- Contact icons -->
  <g stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <!-- phone -->
    <rect x="360" y="310" width="220" height="220" rx="44"/>
    <path d="M420 350c40 90 90 140 180 180"/>
    <path d="M420 350l40-20 40 60-30 30" opacity="0.65"/>
    <!-- email -->
    <rect x="1020" y="310" width="220" height="220" rx="44"/>
    <path d="M1048 370l82 74 82-74"/>
    <path d="M1048 488l70-62" opacity="0.55"/>
    <path d="M1212 488l-70-62" opacity="0.55"/>
  </g>

  <!-- Friendly wave line -->
  <path d="M360 620c160-110 340-140 540-96 180 40 340 36 500-30" fill="none" stroke="#e2e8f0" stroke-width="18" stroke-linecap="round"/>
  <path d="M360 620c160-110 340-140 540-96 180 40 340 36 500-30" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
</svg>

