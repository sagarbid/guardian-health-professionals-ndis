<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Uplifting team and community illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="56" fill="url(#bg)"/>

  <!-- Soft shapes -->
  <path d="M1150 120c170 50 260 170 220 300-44 145-230 120-310 210-92 103-40 240-210 270-190 34-410-112-410-290 0-170 152-276 272-360 130-91 312-166 438-130z" fill="#dbeafe" opacity="0.7"/>
  <path d="M320 180c130-70 280-60 352 40 70 96 10 220-70 318-78 96-180 130-300 82-130-52-200-210-140-330 32-64 92-84 158-110z" fill="#d1fae5" opacity="0.55"/>

  <!-- Main card -->
  <g filter="url(#shadow)">
    <rect x="140" y="190" width="1320" height="520" rx="44" fill="#ffffff"/>
    <rect x="140" y="190" width="1320" height="520" rx="44" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <!-- Reception / community centre hint -->
  <rect x="220" y="250" width="1160" height="70" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="260" y="272" width="220" height="14" rx="7" fill="#94a3b8" opacity="0.35"/>
  <rect x="520" y="272" width="160" height="14" rx="7" fill="#94a3b8" opacity="0.25"/>
  <rect x="1100" y="264" width="240" height="42" rx="18" fill="#ecfdf5" stroke="#d1fae5"/>
  <path d="M1126 287h42" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="1110" cy="287" r="10" fill="#10b981"/>

  <!-- People group (abstract inclusive) -->
  <!-- Participant with wheelchair -->
  <g transform="translate(300 360)">
    <circle cx="130" cy="88" r="44" fill="#fed7aa"/>
    <path d="M90 160c18-26 42-38 72-38s54 12 72 38c12 18 16 44 16 66H74c0-22 4-48 16-66z" fill="#dbeafe"/>
    <circle cx="110" cy="320" r="58" fill="none" stroke="#1d4ed8" stroke-width="12"/>
    <circle cx="110" cy="320" r="10" fill="#1d4ed8"/>
    <path d="M170 250v70c0 22 18 40 40 40h46" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round"/>
    <path d="M150 250h70" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Support worker -->
  <g transform="translate(610 360)">
    <circle cx="170" cy="92" r="46" fill="#fde68a"/>
    <path d="M112 170c22-30 54-44 96-44s74 14 96 44c14 20 20 52 20 80H92c0-28 6-60 20-80z" fill="#bbf7d0"/>
    <path d="M120 208c-32 18-68 30-106 34" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round"/>
    <path d="M140 214c18 14 42 22 72 22s54-8 72-22" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Participant with cane -->
  <g transform="translate(960 360)">
    <circle cx="150" cy="92" r="44" fill="#fecaca"/>
    <path d="M104 170c20-28 48-42 86-42s66 14 86 42c14 20 18 52 18 80H86c0-28 4-60 18-80z" fill="#cffafe"/>
    <path d="M220 190v160" stroke="#0f172a" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
    <circle cx="220" cy="360" r="10" fill="#0f172a" opacity="0.55"/>
  </g>

  <!-- Connection line -->
  <path d="M470 600c160-120 340-148 520-82" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  <circle cx="470" cy="600" r="10" fill="#1d4ed8"/>
  <circle cx="990" cy="518" r="10" fill="#10b981"/>
</svg>

