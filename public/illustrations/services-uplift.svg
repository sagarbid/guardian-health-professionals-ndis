<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Uplifting NDIS services illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="56" fill="url(#bg)"/>

  <!-- Tile grid -->
  <g filter="url(#shadow)">
    <rect x="140" y="160" width="1320" height="580" rx="44" fill="#ffffff"/>
    <rect x="140" y="160" width="1320" height="580" rx="44" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <g fill="#ffffff" stroke="#e2e8f0" stroke-width="2">
    <rect x="220" y="240" width="360" height="190" rx="32"/>
    <rect x="620" y="240" width="360" height="190" rx="32"/>
    <rect x="1020" y="240" width="360" height="190" rx="32"/>
    <rect x="220" y="470" width="360" height="190" rx="32"/>
    <rect x="620" y="470" width="360" height="190" rx="32"/>
    <rect x="1020" y="470" width="360" height="190" rx="32"/>
  </g>

  <!-- Friendly icons -->
  <g stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <!-- Personal Activities (heart) -->
    <path d="M320 330c0-28 34-42 56-18 22-24 56-10 56 18 0 40-56 72-56 72s-56-32-56-72z"/>

    <!-- Transport (wheel + route) -->
    <circle cx="760" cy="330" r="48"/>
    <circle cx="760" cy="330" r="10" fill="#1d4ed8"/>
    <path d="M808 330h90"/>
    <path d="M900 330c26 0 46 20 46 46 0 26-20 46-46 46" opacity="0.55"/>

    <!-- Nursing (shield) -->
    <path d="M1160 274l78 36v64c0 68-46 122-78 130-32-8-78-62-78-130v-64l78-36z"/>
    <path d="M1160 330v70" opacity="0.6"/>
    <path d="M1126 364h68" opacity="0.6"/>

    <!-- Life skills (spark) -->
    <path d="M400 500l18 70 70 18-70 18-18 70-18-70-70-18 70-18 18-70z"/>

    <!-- Community participation (people) -->
    <path d="M700 630v-18c0-26 22-48 48-48h74c26 0 48 22 48 48v18"/>
    <circle cx="785" cy="540" r="36"/>
    <path d="M980 630v-14c0-24 18-42 40-42h48" opacity="0.6"/>

    <!-- Home / SDA (house) -->
    <path d="M1120 590l80-66 80 66v120h-62v-72h-36v72h-62V590z"/>
    <path d="M1250 520h40" opacity="0.6"/>
  </g>

  <!-- Subtle progress line -->
  <path d="M260 705c260 0 420-70 560-70s300 70 520 70" fill="none" stroke="#e2e8f0" stroke-width="18" stroke-linecap="round"/>
  <path d="M260 705c260 0 420-70 560-70s300 70 520 70" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>
</svg>

